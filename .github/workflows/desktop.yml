name: desktop

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: "--win nsis"
            artifact: vitality-desktop-win
          - os: ubuntu-latest
            target: "--linux AppImage"
            artifact: vitality-desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # uiohook-napi rebuilds libuiohook from source via @electron/rebuild:
      # X11/Xtst headers are required on Linux (Wayland still uses XKB/X11
      # libs for the hook build).
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev
      - run: pnpm --filter @vitality/desktop lint
      - run: pnpm --filter @vitality/desktop typecheck
      - run: pnpm --filter @vitality/desktop test
      - run: pnpm --filter @vitality/desktop dist -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
