name: ci

on:
  push:
  pull_request:

jobs:
  lint-typecheck-unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build
      - name: Verify worklet and WASM ship in the production build
        run: |
          test "$(ls apps/web/dist/assets | grep -ci wasm)" -ge 2
          test "$(ls apps/web/dist/assets | grep -ci worklet)" -ge 2

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitality
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vitality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitality -d vitality"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vitality/shared build
      - run: pnpm --filter @vitality/server test:integration
        env:
          DATABASE_URL: postgres://vitality:ci-only-password@127.0.0.1:5432/vitality

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_ACCESS_SECRET: ci-access-secret-please-change-me-32plus
      LIVEKIT_API_SECRET: ci-livekit-secret-please-change-me-32plus
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.dev.yml config --quiet
      - run: docker compose build
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Full-stack proof: drives the PRODUCTION compose stack through its public
  # HTTPS entrypoint (register, WS, chat, uploads, voice-token, Caddy /livekit
  # path, real LiveKit join+publish, backup/restore, restart reconcile).
  # Blocking: a red stack-smoke means the release artifact itself is broken.
  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate CI config
        run: node scripts/init.mjs --domain localhost
      - name: Run the full-stack smoke
        run: node scripts/smoke-stack.mjs
        timeout-minutes: 25
      - name: Dump stack state on failure
        if: failure()
        run: docker compose ps; docker compose logs --tail=200

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitality
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vitality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitality -d vitality"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vitality/web exec playwright install chromium --with-deps
      - run: pnpm --filter @vitality/shared build
      - run: pnpm --filter @vitality/server build
      - name: Migrate the database
        run: pnpm --filter @vitality/server migrate
        env:
          DATABASE_URL: postgres://vitality:ci-only-password@127.0.0.1:5432/vitality
          JWT_ACCESS_SECRET: ci-access-secret-please-change-me-32plus
      - name: Start the API
        run: |
          DATABASE_URL=postgres://vitality:ci-only-password@127.0.0.1:5432/vitality \
          JWT_ACCESS_SECRET=ci-access-secret-please-change-me-32plus \
          UPLOAD_DIR=/tmp/vitality-uploads \
          REGISTRATION_MODE=open \
          PORT=3000 \
          node apps/server/dist/index.js > /tmp/vitality-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/healthz
      - name: Start the web dev server
        run: |
          pnpm --filter @vitality/web exec vite --port 5173 --host 127.0.0.1 > /tmp/vitality-web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null
      - run: pnpm --filter @vitality/web test:e2e
      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            /tmp/vitality-server.log
            /tmp/vitality-web.log

  # Experimental voice e2e: real LiveKit SFU + fake Chromium media devices.
  # NOT required (continue-on-error): media/ICE behavior was never verified
  # on a machine without Docker, so this job proves the flow in CI without
  # blocking merges. Promote to required once it is green twice in a row.
  # If it stays red, the documented manual scenario (docs/MANUAL_TESTS.md)
  # remains the acceptance bar for voice.
  e2e-voice:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitality
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vitality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitality -d vitality"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      livekit:
        image: livekit/livekit-server:v1.13
        ports:
          - 7880:7880
          - 7881:7881
          - 7882:7882/udp
        env:
          LIVEKIT_CONFIG: |
            port: 7880
            log_level: info
            bind_addresses: ["0.0.0.0"]
            rtc:
              tcp_port: 7881
              udp_port: 7882
              use_external_ip: false
            keys:
              devkey: ci-livekit-secret-please-change-me-32plus
            room:
              auto_create: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vitality/web exec playwright install chromium --with-deps
      - run: pnpm --filter @vitality/shared build
      - run: pnpm --filter @vitality/server build
      - name: Migrate the database
        run: pnpm --filter @vitality/server migrate
        env:
          DATABASE_URL: postgres://vitality:ci-only-password@127.0.0.1:5432/vitality
          JWT_ACCESS_SECRET: ci-access-secret-please-change-me-32plus
      - name: Start the API (LiveKit on localhost, public URL ws://)
        run: |
          DATABASE_URL=postgres://vitality:ci-only-password@127.0.0.1:5432/vitality \
          JWT_ACCESS_SECRET=ci-access-secret-please-change-me-32plus \
          UPLOAD_DIR=/tmp/vitality-uploads \
          REGISTRATION_MODE=open \
          LIVEKIT_URL=http://127.0.0.1:7880 \
          LIVEKIT_API_KEY=devkey \
          LIVEKIT_API_SECRET=ci-livekit-secret-please-change-me-32plus \
          LIVEKIT_PUBLIC_URL=ws://127.0.0.1:7880 \
          PORT=3000 \
          node apps/server/dist/index.js > /tmp/vitality-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/healthz
      - name: Start the web dev server
        run: |
          pnpm --filter @vitality/web exec vite --port 5173 --host 127.0.0.1 > /tmp/vitality-web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null
      - run: pnpm --filter @vitality/web test:e2e-voice
      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-voice-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            /tmp/vitality-server.log
            /tmp/vitality-web.log
