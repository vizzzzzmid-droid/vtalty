appId: shop.kirskiy.vitality
productName: vitality
# Keep the executable name IDENTICAL to productName. electron-builder writes
# the executable's basename into the Windows version resource as `InternalName`
# (app-builder-lib/out/winPackager.js), so any difference ships two names for
# one app: `vitality-desktop` (exe/InternalName) vs `vitality`
# (ProductName/FileDescription, shortcut name, AUMID). It also has to be a
# plain file-safe name: the workspace package name (@vitality/desktop) is
# rejected by the AppImage target's validateCriticalPathString, so it must
# never be derived from `name`.
executableName: vitality
copyright: Copyright © 2026 vitality contributors
asarUnpack:
  # uiohook-napi ships a native .node binary: keep it unpacked so the OS
  # loader can mmap it (packed asar breaks native modules on Windows).
  - "**/uiohook-napi*/**/*.node"
files:
  - dist/**
  - package.json
  # uiohook-napi prebuilds must ship with the app for global PTT
  # (node-gyp-build resolves them relative to the package root).
  - "node_modules/uiohook-napi/dist/**"
  - "node_modules/uiohook-napi/package.json"
  - "node_modules/uiohook-napi/prebuilds/**"
  - "node_modules/node-gyp-build/**"
extraResources:
  # The tray icon MUST be a real file outside the asar (nativeImage loads it
  # from disk at runtime) and the `files:` allowlist above never shipped
  # assets/ — the packaged app then created no tray icon at all while
  # minimize-to-tray still hid the window (reported: app disappears entirely).
  - from: assets
    to: assets
extraMetadata:
  main: dist/main.js
directories:
  output: release
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: vitality
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/
  category: Network;InstantMessaging;
  description: Self-hosted voice and text for friends
