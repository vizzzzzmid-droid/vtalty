# Full production-like stack: caddy + server + web + postgres + livekit.
# Usage:  cp .env.example .env && cp livekit.example.yaml livekit.yaml && make up
name: vitality

# Shared hardening: no setuid escalation, rotated json logs for every service.
x-security: &default-security
  security_opt:
    - no-new-privileges:true

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    # Pinned by digest (see docs/ADMIN.md for the update procedure).
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vitality}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitality} -d ${POSTGRES_DB:-vitality}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    <<: [*default-security, *default-logging]

  livekit:
    image: livekit/livekit-server:v1.13@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7881:7881/tcp" # WebRTC ICE over TCP (fallback)
      - "7882:7882/udp" # WebRTC media (UDP mux, single port)
      - "3478:3478/udp" # TURN/UDP (+STUN)
      - "5349:5349/tcp" # TURN/TLS
    # NOTE: intentionally no healthcheck. LiveKit exposes no stable HTTP
    # health endpoint on :7880, and the minimal Alpine image only ships
    # busybox wget (exit code 1 for every HTTP error, so a "any response is
    # alive" probe cannot distinguish 404-alive from connection-refused).
    # The server does not depend on LiveKit at boot (Phase 4 adds a
    # server-side reachability check to /readyz instead).
    restart: unless-stopped
    <<: [*default-security, *default-logging]

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-vitality}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vitality}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      COOKIE_SECURE: "true"
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite-only}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://localhost/livekit}
      VOICE_MAX_PARTICIPANTS: ${VOICE_MAX_PARTICIPANTS:-15}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    # Read-only root filesystem (uploads stay writable via the volume);
    # tmpfs covers Node's temp needs. Already runs as USER node (Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    <<: [*default-security, *default-logging]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    # Static file server only: read-only root, tmp just in case.
    read_only: true
    tmpfs:
      - /tmp
    <<: [*default-security, *default-logging]

  caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Caddy admin API listens on localhost:2019 by default in the official image.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    <<: [*default-security, *default-logging]

volumes:
  pgdata:
    name: vitality-pgdata
  uploads:
    name: vitality-uploads
  caddy_data:
    name: vitality-caddy-data
  caddy_config:
    name: vitality-caddy-config
