# LiveKit config template for vitality.
# Copy to livekit.yaml and fill the secrets (livekit.yaml is gitignored):
#   cp livekit.example.yaml livekit.yaml
# Key names verified against livekit/livekit config-sample.yaml (v1.13, Sep 2026).
# Notes:
# - `webhook` is SINGULAR with `api_key` + `urls`.
# - `rtc.udp_port` accepts a single port (UDP mux, fewer firewall rules) or a
#   small range such as 7882-7892. Single port 7882 chosen for a small VPS.
# - `log_level` is a top-level key.
# - Signalling reaches LiveKit through Caddy (`/livekit` path prefix, see
#   Caddyfile); the client is told `wss://<domain>/livekit` and appends
#   `/rtc` itself (verified in livekit-client source).
# - Host networking vs published ports: on a Linux VPS prefer
#   `network_mode: host` for this service (best media performance, no NAT
#   hairpin between container and host). The compose files use published
#   ports (bridge) because that works everywhere, including Docker Desktop
#   and dev machines. See docs/VOICE.md for the trade-off.
# - TURN/TLS (5349) is DISABLED by default: LiveKit v1.13 refuses to boot
#   with `tls_port` set but no `turn.domain` ("TURN domain required" boot
#   loop — observed in CI). TURN/UDP 3478 + ICE/TCP 7881 cover all but the
#   strictest corporate firewalls. To enable TURN/TLS, uncomment below and
#   set `domain` to your public hostname (plus `cert_file`/`key_file` on
#   TLS-intercepting networks) — see docs/VOICE.md.

port: 7880
log_level: info

bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

turn:
  enabled: true
  udp_port: 3478
  # tls_port: 5349
  # domain: vitality.kirskiy.shop
  # cert_file: /etc/livekit/fullchain.pem
  # key_file: /etc/livekit/privkey.pem

keys:
  devkey: dev-livekit-secret-please-change-me-32plus

room:
  auto_create: true

webhook:
  api_key: devkey
  urls:
    - http://server:3000/webhooks/livekit
